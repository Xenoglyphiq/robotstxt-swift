name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Validate vendored spec
        run: uv run .kit/validate.py .spec

  linux:
    runs-on: ubuntu-latest
    container: swift:6.4
    steps:
      - uses: actions/checkout@v7
      - name: Build and unit tests
        run: swift test
      - name: Conformance
        run: swift run robotstxt-conformance
      - name: Canonical examples
        run: |
          swift run check_path
          swift run list_sitemaps
          swift run explain_decision
      - name: Short fuzz run
        run: FUZZ_SECONDS=30 swift run -c release robotstxt-fuzz

  macos:
    # Private repo: macOS jobs run on the org's self-hosted Mac, not 10x-billed hosted runners.
    runs-on: [self-hosted, macOS, ARM64, swift]
    steps:
      - uses: actions/checkout@v7
      - name: Build and unit tests
        run: swift test
      - name: Conformance
        run: swift run robotstxt-conformance
      - name: Canonical examples
        run: |
          swift run check_path
          swift run list_sitemaps
          swift run explain_decision
      - name: Benchmark builds and matches the checksum (timings not recorded from CI)
        run: |
          if [ -d .spec/bench ]; then swift run -c release robotstxt-bench; else echo "spec bench input not vendored yet"; fi
